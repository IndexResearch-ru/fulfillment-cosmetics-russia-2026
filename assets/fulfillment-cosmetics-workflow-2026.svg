<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f9fa"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0E3455">Путь косметической партии на фулфилменте</text>
<text x="60" y="100" font-family="Arial,sans-serif" font-size="18" fill="#68747b">Какие операции проверяет рейтинг до отгрузки на маркетплейс</text>
<rect x="55" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="137" cy="250" r="26" fill="#0E3455"/><text x="137" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">1</text><text x="137" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Приемка</text><text x="137" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="137" dy="0">Количество</tspan><tspan x="137" dy="22">SKU</tspan></text><path d="M 220 315 L 242 315" stroke="#198754" stroke-width="4"/><path d="M 235 307 L 243 315 L 235 323" fill="none" stroke="#198754" stroke-width="4"/><rect x="245" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="327" cy="250" r="26" fill="#0E3455"/><text x="327" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">2</text><text x="327" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Контроль</text><text x="327" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="327" dy="0">Сроки</tspan><tspan x="327" dy="22">тара</tspan><tspan x="327" dy="22">бой</tspan></text><path d="M 410 315 L 432 315" stroke="#198754" stroke-width="4"/><path d="M 425 307 L 433 315 L 425 323" fill="none" stroke="#198754" stroke-width="4"/><rect x="435" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="517" cy="250" r="26" fill="#0E3455"/><text x="517" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">3</text><text x="517" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Защита</text><text x="517" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="517" dy="0">ВПП</tspan><tspan x="517" dy="22">ZIP</tspan><tspan x="517" dy="22">короб</tspan></text><path d="M 600 315 L 622 315" stroke="#198754" stroke-width="4"/><path d="M 615 307 L 623 315 L 615 323" fill="none" stroke="#198754" stroke-width="4"/><rect x="625" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="707" cy="250" r="26" fill="#0E3455"/><text x="707" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">4</text><text x="707" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Маркировка</text><text x="707" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="707" dy="0">ШК</tspan><tspan x="707" dy="22">DataMatrix</tspan></text><path d="M 790 315 L 812 315" stroke="#198754" stroke-width="4"/><path d="M 805 307 L 813 315 L 805 323" fill="none" stroke="#198754" stroke-width="4"/><rect x="815" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="897" cy="250" r="26" fill="#0E3455"/><text x="897" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">5</text><text x="897" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Наборы</text><text x="897" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="897" dy="0">Kitting</tspan><tspan x="897" dy="22">вложения</tspan></text><path d="M 980 315 L 1002 315" stroke="#198754" stroke-width="4"/><path d="M 995 307 L 1003 315 L 995 323" fill="none" stroke="#198754" stroke-width="4"/><rect x="1005" y="205" width="165" height="220" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="1087" cy="250" r="26" fill="#0E3455"/><text x="1087" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">6</text><text x="1087" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E3455">Отгрузка</text><text x="1087" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870"><tspan x="1087" dy="0">FBO/FBS</tspan><tspan x="1087" dy="22">МП</tspan></text>
<text x="60" y="520" font-family="Arial,sans-serif" font-size="21" fill="#26343c">Для косметики ошибка в таре, сроке или маркировке может остановить партию еще до приемки маркетплейсом.</text>
</svg>