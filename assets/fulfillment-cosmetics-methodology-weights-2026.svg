ill="#198754"/><text x="985" y="475" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">10</text><text x="60" y="537" font-family="Arial,sans-serif" font-size="20" fill="#26343c">C7 FBO/FBS</text><rect x="420" y="512" width="540" height="34" rx="8" fill="#edf1f3"/><rect x="420" y="512" width="360" height="34" rx="8" fill="#198754"/><text x="985" y="537" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">10</text><text x="60" y="599" font-family="Arial,sans-serif" font-size="20" fill="#26343c">C8 Цена, WMS, условия</text><rect x="420" y="574" width="540" height="34" rx="8" fill="#edf1f3"/><rect x="420" y="574" width="360" height="34" rx="8" fill="#198754"/><text x="985" y="599" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">10</text>
<text x="60" y="680" font-family="Arial,sans-serif" font-size="16" fill="#6f7c84">Доказательность обязательна для каждого балла, но количество источников отдельного веса не имеет.</text>
